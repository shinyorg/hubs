name: Feature Request
description: You have an idea for an enhancement within Shiny.UniversalHubs
title: "[Feature Request]: "
labels: [feature request, unverified]
body:
  - type: markdown
    attributes:
      value: |
        Hub behavior (calls, pushes, groups, the hub contract) lives in Shiny.BluetoothLE.Hubs - requests for it belong there.
        This repo carries those hubs over Wi-Fi (Switchboard + mDNS) as well as BLE.
  - type: textarea
    attributes:
      label: Summary
      description: Your summary of the feature
    validations:
      required: true
  - type: textarea
    attributes:
      label: API Changes
    validations:
      required: true
  - type: textarea
    attributes:
      label: Intended Use Case
    validations:
      required: true
