name: Feature Request
description: You have an idea for an enhancement within Shiny.UniversalHubs
title: "[Feature Request]: "
labels: [feature request, unverified]
body:
  - type: markdown
    attributes:
      value: |
        Shiny.UniversalHubs: SignalR-style hubs written once and served over Bluetooth LE, HTTP (WebSocket + mDNS),
        MultipeerConnectivity, Nearby Connections, or a transport of your own.

        > ⭐ **Finding this library useful? Please give the repository a [Star](https://github.com/shinyorg/hubs) - it's free and it's how the project gets seen.**
  - type: textarea
    attributes:
      label: Summary
      description: Your summary of the feature
    validations:
      required: true
  - type: textarea
    attributes:
      label: API Changes
    validations:
      required: true
  - type: textarea
    attributes:
      label: Intended Use Case
    validations:
      required: true
