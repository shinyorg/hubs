name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - v*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      id-token: write   # required for NuGet trusted publishing (OIDC)
      contents: read

    # macOS because the libraries also target iOS and Mac Catalyst (Xcode only exists here).
    # Build.slnf is the libraries and tests only - the samples aren't built in CI.
    runs-on: xcode-27

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
          fetch-depth: 0   # Nerdbank.GitVersioning needs the history

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
          dotnet-version: '10.0.400'
          # macos: Shiny.UniversalHubs.Multipeer and .Nearby also target net10.0-macos (AppKit apps)
          workloads: maui-ios, maui-android, maui-maccatalyst, macos

    # Shiny.UniversalHubs.Nearby carries Google's NearbyConnections for iOS and macOS as a native framework. It only
    # changes with native/ShinyNearbyBridge, so it is cached on that folder's contents.
    - name: Cache the Nearby bridge
      id: nearby-cache
      uses: actions/cache@v4
      with:
        path: |
          native/ShinyNearbyBridge/build/ios
          native/ShinyNearbyBridge/build/macos
        key: nearby-bridge-${{ hashFiles('native/ShinyNearbyBridge/Package.swift', 'native/ShinyNearbyBridge/Sources/**', 'native/ShinyNearbyBridge/build.sh') }}

    - name: Build the Nearby bridge
      if: steps.nearby-cache.outputs.cache-hit != 'true'
      run: native/ShinyNearbyBridge/build.sh

    - name: Build
      run: dotnet build Build.slnf /restore -m -property:Configuration=Release -property:PublicRelease=true

    - name: Test Shiny.BluetoothLE.Hubs
      run: dotnet test tests/Shiny.BluetoothLE.Hubs.Tests --no-build -property:Configuration=Release

    - name: Test Shiny.UniversalHubs
      run: dotnet test tests/Shiny.UniversalHubs.Tests --no-build -property:Configuration=Release

    - name: Publish Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: nugets
        path: ${{ github.workspace }}/artifacts
        retention-days: 5

    - name: NuGet Login (OIDC)
      id: nuget-login
      if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/preview' || startsWith(github.ref, 'refs/heads/v')) }}
      uses: NuGet/login@v1
      with:
        user: aritchie

    - name: Publish NuGets
      if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/preview' || startsWith(github.ref, 'refs/heads/v')) }}
      run: dotnet nuget push "**/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --skip-duplicate
