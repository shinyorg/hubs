name: CI

# Every push to main, and every pull request into it: build and test the packages the way a release builds them,
# without publishing. Releases come from tags - see release.yml. Toolchain pins match release.yml - bump them together.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macOS because the libraries also target iOS, Mac Catalyst and macOS (Xcode only exists here).
    # Build.slnf is the libraries and tests only - the samples aren't built in CI.
    runs-on: xcode-27

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
          dotnet-version: '11.0.100'
          # macos: Shiny.UniversalHubs.Multipeer and .Nearby also target net11.0-macos (AppKit apps)
          workloads: maui-ios, maui-android, maui-maccatalyst, macos

    - name: Select Xcode 27.1
      run: sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer && xcodebuild -version

    # Shiny.UniversalHubs.Nearby carries Google's NearbyConnections for iOS and macOS as a native framework. It only
    # changes with native/ShinyNearbyBridge, so it is cached on that folder's contents.
    - name: Cache the Nearby bridge
      id: nearby-cache
      uses: actions/cache@v6
      with:
        path: |
          native/ShinyNearbyBridge/build/ios
          native/ShinyNearbyBridge/build/macos
        key: nearby-bridge-${{ hashFiles('native/ShinyNearbyBridge/Package.swift', 'native/ShinyNearbyBridge/Sources/**', 'native/ShinyNearbyBridge/build.sh') }}

    - name: Build the Nearby bridge
      if: steps.nearby-cache.outputs.cache-hit != 'true'
      run: native/ShinyNearbyBridge/build.sh

    - name: Build
      run: dotnet build Build.slnf /restore -m -property:Configuration=Release

    - name: Test Shiny.UniversalHubs.BluetoothLE (and the core)
      run: dotnet test --project tests/Shiny.UniversalHubs.BluetoothLE.Tests --no-build -c Release

    - name: Test Shiny.UniversalHubs
      run: dotnet test --project tests/Shiny.UniversalHubs.Tests --no-build -c Release

    - name: Publish Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: nugets
        path: ${{ github.workspace }}/artifacts
        retention-days: 5
